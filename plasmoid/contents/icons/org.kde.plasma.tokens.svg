<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#161f38" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79e2fb" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1f6feb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Cyan Glow -->
    <radialGradient id="cyanGlow" cx="68%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#79e2fb" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cell Gradients -->
    <linearGradient id="epicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8f4fd" />
      <stop offset="100%" stop-color="#79e2fb" />
    </linearGradient>

    <linearGradient id="lvl4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Grid -->
  <circle cx="340" cy="220" r="180" fill="url(#cyanGlow)" />

  <!-- Grid of Heatmap Squares (4x4) -->
  <g id="heatmap-cells">
    <!-- Row 0 -->
    <rect x="101" y="101" width="64" height="64" rx="14" fill="#162032" stroke="#222f47" stroke-width="2" />
    <rect x="183" y="101" width="64" height="64" rx="14" fill="#0a3069" stroke="#11458e" stroke-width="2" />
    <rect x="265" y="101" width="64" height="64" rx="14" fill="#1158c7" stroke="#1f6feb" stroke-width="2" />
    <rect x="347" y="101" width="64" height="64" rx="14" fill="url(#epicGrad)" stroke="#ffffff" stroke-width="2" filter="url(#neonFilter)" />

    <!-- Row 1 -->
    <rect x="101" y="183" width="64" height="64" rx="14" fill="#0a3069" stroke="#11458e" stroke-width="2" />
    <rect x="183" y="183" width="64" height="64" rx="14" fill="#1f6feb" stroke="#388bfd" stroke-width="2" />
    <rect x="265" y="183" width="64" height="64" rx="14" fill="url(#lvl4Grad)" stroke="#79c0ff" stroke-width="2" filter="url(#subtleGlow)" />
    <rect x="347" y="183" width="64" height="64" rx="14" fill="#1f6feb" stroke="#388bfd" stroke-width="2" />

    <!-- Row 2 -->
    <rect x="101" y="265" width="64" height="64" rx="14" fill="#1158c7" stroke="#1f6feb" stroke-width="2" />
    <rect x="183" y="265" width="64" height="64" rx="14" fill="url(#lvl4Grad)" stroke="#79c0ff" stroke-width="2" filter="url(#subtleGlow)" />
    <rect x="265" y="265" width="64" height="64" rx="14" fill="url(#epicGrad)" stroke="#ffffff" stroke-width="2" filter="url(#neonFilter)" />
    <rect x="347" y="265" width="64" height="64" rx="14" fill="url(#lvl4Grad)" stroke="#79c0ff" stroke-width="2" />

    <!-- Row 3 -->
    <rect x="101" y="347" width="64" height="64" rx="14" fill="#162032" stroke="#222f47" stroke-width="2" />
    <rect x="183" y="347" width="64" height="64" rx="14" fill="#1158c7" stroke="#1f6feb" stroke-width="2" />
    <rect x="265" y="347" width="64" height="64" rx="14" fill="#1f6feb" stroke="#388bfd" stroke-width="2" />
    <rect x="347" y="347" width="64" height="64" rx="14" fill="#1158c7" stroke="#1f6feb" stroke-width="2" />
  </g>

  <!-- Decorative Circuit / AI Pulse Path -->
  <path d="M 133 133 L 215 215 L 297 297 L 379 133" fill="none" stroke="#79e2fb" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.35" />

  <!-- Four-point AI Sparkle in Top-Right Epic Cell -->
  <path d="M 379 123 Q 379 133 389 133 Q 379 133 379 143 Q 379 133 369 133 Q 379 133 379 123 Z" fill="#ffffff" filter="url(#neonFilter)" />
</svg>
